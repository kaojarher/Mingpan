        // ============================================================
        // 農曆轉換（修正版）
        // 表格說明：
        //   高16位：位元15~4 表示1~12月大小（1=大月30天, 0=小月29天）

        //   另有一個獨立的閏月大小資料，存在下一年資料的最高位

        //   每個 entry 為 20 bits：
        //     bits 19-16: 閏月月份 (0=無)
        //     bits 15-4:  各月大小 (bit15=1月, bit4=12月, 1=大30, 0=小29)

        // ============================================================
        
        // ============================================================
        // lunarInfo 格式（v3 修正版，由 lunardate 函式庫驗證）：

        //   bits 3-0:  閏月月份（0=無閏月）
        // ============================================================
        const lunarInfo = [
            0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2, // 1900-1909

            0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950, // 1930-1939
            0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557, // 1940-1949

            0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530, // 2020-2029

            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0, // 2040-2049
            0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0, // 2050-2059

            0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0, // 2070-2079
            0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160, // 2080-2089
            0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f242, // 2090-2099
            0x00000,0x00000 // 2100-2101
        ];

        // 取得農曆年各月資訊（v3 修正）
        function getLunarYearMonths(year) {
            let info = lunarInfo[year - 1900];
            // 閏月月份：bits 3-0（低4位）
            let leapMonth = info & 0xf;
            // 閏月天數：bit 16（1=30天，0=29天）
            let leapDays = ((info >> 16) & 0x1) ? 30 : 29;
            
            let months = [];
            for (let m = 1; m <= 12; m++) {
                // bit位置：第m月對應 bit (16-m)
                let bit = 1 << (16 - m);
                let days = (info & bit) ? 30 : 29;
                months.push({ month: m, days: days, isLeap: false });
                // 若有閏月，插入於正常月之後
                if (leapMonth === m) {
                    months.push({ month: m, days: leapDays, isLeap: true });
                }
            }
            return months;
        }
        
        function getLunarYearDays(year) {
            return getLunarYearMonths(year).reduce((sum, m) => sum + m.days, 0);

        // 農曆基準：1900年1月31日 = 庚子正月初一
        // 注意：使用 Date.UTC() 避免台灣夏令時間（DST）造成時區 off-by-one 誤差
        function solarToLunar(year, month, day) {
            let diffDays = Math.round((Date.UTC(year, month - 1, day) - Date.UTC(1900, 0, 31)) / 86400000);
            if (diffDays < 0) return null;
            
            let lunarYear = 1900;
            let remaining = diffDays;
            
            while (true) {
                let yearDays = getLunarYearDays(lunarYear);
                if (remaining < yearDays) break;
                remaining -= yearDays;
                lunarYear++;
                if (lunarYear > 2100) return null;
            }
            
            let months = getLunarYearMonths(lunarYear);
            let lunarMonth = 1, lunarDay = 1;
            let isLeap = false;
            for (let i = 0; i < months.length; i++) {
                let m = months[i];
                if (remaining < m.days) {
                    lunarMonth = m.month;
                    isLeap = m.isLeap;
                    lunarDay = remaining + 1;
                    break;
                }
                remaining -= m.days;
            }
            
            // 年干支（以農曆年計算）
            const stemIdx = ((lunarYear - 4) % 10 + 10) % 10;
            const branchIdx = ((lunarYear - 4) % 12 + 12) % 12;
            const yearStem = HEAVENLY_STEMS[stemIdx];
            const yearBranch = EARTHLY_BRANCHES[branchIdx];
            
            return { lunarYear, lunarMonth, lunarDay, isLeap, yearStem, yearBranch };

        // 公式：命宮地支 = 寅 + (月數-1) - 時辰序 (mod 12)，但方向相反
        // 標準：寅宮=0，由生月（虎=1月）順數到生月所在宮，再逆數時辰
        function getMingIdx(astroMonth, hourIdx) {

            // 寅宮為索引0；月份1對應寅，正數

        function getZiweiIndex(lunarDay, cycle) {
            // 從寅宮（idx=0）起算，安紫微
            // 紫微安法：以五行局數 cycle 為步長，將生日分段
            let quotient = Math.ceil(lunarDay / cycle);

            // 奇數商順行，偶數商逆行（相對寅宮）
            // 實際：紫微起寅，由初一=寅開始，每 cycle 日換一格
            // idx = (quotient - 1)，若remainder>0 且商為偶數則退一格
            // 業界通用算法：
            let step = Math.floor((lunarDay - 1) / cycle);
            let rem = (lunarDay - 1) % cycle;
            // 奇數步順行（+step），偶數步逆行從寅 → 寅向後
            // 實作：每 cycle 格前進一個宮
            // 標準安法（最常用版本）：
            let idx;
            if (rem === 0) {
                idx = step % 12;
            } else {
                let base = step;
                let parity = step % 2;
                if (parity === 0) {
                    // 偶數商，逆行 rem 格
                    idx = (base - rem + 120) % 12;
                } else {
                    // 奇數商，順行 rem 格
                    idx = (base + rem) % 12;
                }
            }
            return idx;

            // 業界標準：天府從寅起逆行，紫微從寅起順行，兩者相合於同一地支（紫微的宮位）

                else caiBaiDesc="財帛宮平穩，財源穩定，需靠努力積累";
            } else {
                caiBaiDesc="財帛宮無主星，借對宮論財，財運以輔星與四化為主要影響";
            }
            
            // 事業評估
            let guanluStars = guanluPalaceIdx >= 0 ? allStars[guanluPalaceIdx] : [];
            let guanluMain = guanluStars.find(s=>/紫微|天機|太陽|武曲|天同|廉貞|天府|太陰|貪狼|巨門|天相|天梁|七殺|破軍/.test(s));
            let careerDesc = "";
            if(guanluMain){
                let sn = guanluMain.replace(/[🔷🔶⭐⚠️].*$/,"");
                const careerMap = {
                    "紫微":"官祿宮紫微，具領導才能，適合主管或自行創業，職涯發展穩固",
                    "天機":"官祿宮天機，擅長策劃與技術，職涯多轉換，以腦力見長",
                    "太陽":"官祿宮太陽，適合公職、教育或政治，名聲廣播，職場人緣佳",
                    "武曲":"官祿宮武曲，財務實業型事業，果斷決策，適合金融、工程",
                    "天同":"官祿宮天同，工作環境和諧，無須太大野心即可安穩發展",
                    "廉貞":"官祿宮廉貞，社交型事業，適合藝文、外交、娛樂領域",
                    "天府":"官祿宮天府，行政管理見長，職位穩固，適合公務體系",
                    "太陰":"官祿宮太陰，細膩嚴謹，適合幕後工作或財務相關職位",
                    "貪狼":"官祿宮貪狼，多才多藝，公關業務見長，中年後事業大發",
                    "巨門":"官祿宮巨門，口才見長，適合教學、諮詢、傳播媒體",
                    "天相":"官祿宮天相，輔佐型人才，適合行政與服務型工作",
                    "天梁":"官祿宮天梁，清高之職，適合教育、醫療、公益領域",
                    "七殺":"官祿宮七殺，衝勁強，適合武職、競爭激烈行業，一生多變",
                    "破軍":"官祿宮破軍，開創型人才，適合創業、改革性工作，職涯大起伏"
                };
                careerDesc = careerMap[sn] || "官祿宮主星主導事業走向，以自身努力為主";
            } else {
                careerDesc = "官祿宮無主星，借對宮論事業，以輔星四化判斷職涯走向";
            }
            
            // 感情評估
            let fuqiStars = fuqiPalaceIdx >= 0 ? allStars[fuqiPalaceIdx] : [];
            let fuqiMain = fuqiStars.find(s=>/紫微|天機|太陽|武曲|天同|廉貞|天府|太陰|貪狼|巨門|天相|天梁|七殺|破軍/.test(s));
            let loveDesc = "";
            if(fuqiMain){
                let sn = fuqiMain.replace(/[🔷🔶⭐⚠️].*$/,"");
                const loveMap = {
                    "紫微":"配偶氣質高貴，婚姻有尊嚴感，惟雙方需相互尊重",
                    "天機":"配偶聰明善變，感情多起伏，婚後仍有變動",
                    "太陽":"另一半外向開朗，婚姻陽光，惟男命需防配偶過於強勢",
                    "武曲":"配偶個性剛強務實，婚姻較為現實，溝通需努力",
                    "天同":"配偶溫和隨和，婚姻生活平靜愜意",
                    "廉貞":"感情豐富，配偶魅力出眾，惟桃花複雜需注意",
                    "天府":"配偶穩健務實，婚姻基礎扎實，財務無虞",
                    "太陰":"配偶細膩溫柔，感情甜蜜，惟情緒敏感需包容",
                    "貪狼":"桃花極旺，感情生活多彩，婚後需防外遇",
                    "巨門":"感情多口舌，夫妻溝通需特別用心",
                    "天相":"配偶品格端正，婚姻穩固，互相扶持",
                    "天梁":"配偶年齡差距較大或個性成熟，婚姻受長輩影響",
                    "七殺":"婚姻有衝突，彼此個性剛強，需相互磨合",
                    "破軍":"婚姻有波折，可能有離異，需多加珍惜"
                };
                loveDesc = loveMap[sn] || "夫妻宮主星影響婚姻品質";
            } else {
                loveDesc = "夫妻宮無主星，感情走向由對宮輔星與流年四化決定";
            }
            
            // 整體評星（簡易版）
            let totalScore = 3;
            if(hasLu || hasQuan) totalScore++;
            if(hasJi) totalScore--;
            if(gejuList.some(g => g.includes("格"))) totalScore++;
            totalScore = Math.max(1, Math.min(5, totalScore));
            
            const cycleName = ["水二局","木三局","金四局","土五局","火六局"][cycle-2] || "金四局";
            
            return {
                mainStar, mainTrait: starTraits[mainStar] || "以流年大運判斷",
                gejuList, caiBaiDesc, careerDesc, loveDesc, totalScore,
                cycleName, mingBranch: PALACE_ORDER[mingIdx], shenBranch: PALACE_ORDER[shenIdx]
            };
        }
        
        // ===================== 主渲染 =====================
        function renderAll() {
            const year = parseInt(document.getElementById('year').value);
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            const hourIdx = parseInt(document.getElementById('hour').value);
            const gender = document.getElementById('gender').value;
            
            const rawLunar = solarToLunar(year, month, day);
            if (!rawLunar) {
                document.getElementById('chartArea').innerHTML = '<div class="error-msg">❌ 日期轉換錯誤，請確認日期範圍</div>';
                return;
            }
            
            let displayLeap = rawLunar.isLeap ? "閏" : "";
            let displayLunar = `${rawLunar.lunarYear}年 ${displayLeap}${rawLunar.lunarMonth}月${rawLunar.lunarDay}日`;
            
            let astroMonth = getAstroMonth(rawLunar);
            let astroDay = rawLunar.lunarDay;
            
            const mingIdx = getMingIdx(astroMonth, hourIdx);
            const shenIdx = getShenIdx(astroMonth, hourIdx);
            const cycle = getElementCycle(rawLunar.yearStem, mingIdx);
            const ziwei = getZiweiIndex(astroDay, cycle);
            const tianfu = getTianfuFromZiwei(ziwei);
            let stars = placeMajorStars(ziwei, tianfu);
            let aux = placeAuxiliaryStars(rawLunar.yearStem, rawLunar.yearBranch, astroMonth, astroDay, hourIdx, mingIdx);
            let { stars: starFinal, auxGrid: auxFinal } = applyTransform(stars, aux, rawLunar.yearStem);
            
            let allStars = [];
            for (let i = 0; i < 12; i++) allStars.push([...starFinal[i], ...auxFinal[i]]);
            
            const palaceStems = getPalaceStems(rawLunar.yearStem);
            let palaceGanZhi = [];
            for (let i = 0; i < 12; i++) palaceGanZhi.push(palaceStems[i] + PALACE_ORDER[i]);
            
            const mingGanZhi = palaceGanZhi[mingIdx];
            const mingStem = mingGanZhi[0];
            const mingBranch = mingGanZhi[1];
            const decadeMap = getDecadeInfo(mingIdx, mingStem, mingBranch, gender, cycle);
            
            let palaceNames = [];
            for (let i = 0; i < 12; i++) palaceNames.push(MING_12_NAMES[(mingIdx - i + 12) % 12]);
            
            // 命盤 HTML
            let html = `<div class="info-bar">
                <span>📆 農曆 ${displayLunar} (${rawLunar.yearStem}${rawLunar.yearBranch}年)</span>
                <span>⚧ ${gender}</span>
                <span>🔮 ${["水二局","木三局","金四局","土五局","火六局"][cycle-2]||"金四局"} (起運${cycle}歲)</span>
            </div>`;
            html += `<div class="palace-grid">`;
            for (let i = 0; i < 12; i++) {
                let starText = allStars[i].length ? allStars[i].join('<br>') : '—';
                let shenMark = (i === shenIdx) ? '<span class="shen-marker">身</span>' : '';
                let decadeHtml = '';
                if (decadeMap[i]) {
                    decadeHtml = `<div class="decade-info">📅 ${decadeMap[i].full} 大運 (${decadeMap[i].ageRange})</div>`;
                }
                let isMing = (i === mingIdx);
                html += `
                    <div class="palace-card${isMing?' ming-palace':''}">
                        <div class="palace-name">${palaceNames[i]}${shenMark}</div>
                        <div class="palace-stem-branch">${palaceGanZhi[i]}</div>
                        <div class="stars">${starText}</div>
                        ${decadeHtml}
                    </div>
                `;
            }
            html += `</div>
            <div style="font-size:0.7rem;text-align:center;margin-top:8px;color:#7e5a3c;">
                🔷祿 🔶權 ⭐科 ⚠️忌 ｜ 命宮以深框標示 ｜ 大運至90歲<br>
                ✅ 農曆 v3 修正版：lunarInfo 全面校正 × 閏月算法修正（lunardate 驗證）
            </div>`;
            document.getElementById('chartArea').innerHTML = html;
            
            // 命評
            const my = generateMingYuan(mingIdx, shenIdx, allStars, palaceNames, palaceGanZhi, decadeMap, rawLunar, gender, cycle);
            let dots = (n, total) => Array(total).fill(0).map((_, i) => `<span class="dot${i < n ?' filled':''}"></span>`).join('');
            
            let myHtml = `
            <div class="mingyuan-section">
                <div class="mingyuan-title">✨ 命評·格局解析 ✨</div>
                <div class="mingyuan-grid">
                    <div class="mingyuan-card">
                        <h4>🌟 命宮主星 · ${my.mainStar}</h4>
                        <p>${my.mainTrait}</p>
                        <div class="rating-bar">
                            <span class="rating-label">格局</span>
                            <div class="rating-dots">${dots(my.totalScore, 5)}</div>
                        </div>
                    </div>
                    <div class="mingyuan-card">
                        <h4>🏆 命盤格局</h4>
                        <p>${my.gejuList.map(g=>'• '+g).join('<br>')}</p>
                    </div>
                    <div class="mingyuan-card">
                        <h4>💰 財運分析</h4>
                        <p>${my.caiBaiDesc}</p>
                    </div>
                    <div class="mingyuan-card">
                        <h4>💼 事業走向</h4>
                        <p>${my.careerDesc}</p>
                    </div>
                    <div class="mingyuan-card">
                        <h4>💕 感情婚姻</h4>
                        <p>${my.loveDesc}</p>
                    </div>
                    <div class="mingyuan-card">
                        <h4>📊 基本資訊</h4>
                        <p>命宮地支：<strong>${my.mingBranch}</strong>宮<br>
                        身宮地支：<strong>${my.shenBranch}</strong>宮<br>
                        五行局：<strong>${my.cycleName}</strong>（起運${cycle}歲）<br>
                        生年：<strong>${rawLunar.yearStem}${rawLunar.yearBranch}</strong>年</p>
                    </div>
                </div>
                <div class="mingyuan-summary">
                    <strong>綜合命評：</strong>
                    本命以 <strong>${my.mainStar}</strong> 坐命，${my.mainTrait.substring(0,40)}……格局上呈現「${my.gejuList[0]}」之象。
                    財路上，${my.caiBaiDesc.substring(0,35)}。
                    事業面，${my.careerDesc.substring(0,35)}。
                    感情上，${my.loveDesc.substring(0,35)}。
                    總體而言，此命格需把握大運流年的吉凶起伏，積極進取方能顯現命盤中的優良格局。
                </div>
            </div>`;
            document.getElementById('mingyuanArea').innerHTML = myHtml;
            
            // 十二宮詳解
            let analysisHtml = '<div class="detail-analysis">';
            for (let i = 0; i < 12; i++) {
                let starList = allStars[i];
                let mainStar = starList.find(s => /紫微|天機|太陽|武曲|天同|廉貞|天府|太陰|貪狼|巨門|天相|天梁|七殺|破軍/.test(s));
                let desc = mainStar ? (STAR_MEANINGS[mainStar.replace(/[🔷🔶⭐⚠️].*$/,'')] || "主星影響此宮") : "無主星，借對宮論斷";
                let decadeText = decadeMap[i] ? `大運 ${decadeMap[i].full} (${decadeMap[i].ageRange})` : '此宮位無大運（超過90歲或未起運）';
                analysisHtml += `
                    <div class="palace-detail">
                        <h4>${palaceNames[i]} 宮 <span style="font-size:0.7rem;">${palaceGanZhi[i]}</span> <span class="star-keywords">${starList.slice(0,4).join(', ')||'無星'}</span></h4>
                        <p>📌 ${desc}。${decadeText}，此期間此宮位領域能量增強。</p>
                    </div>
                `;
            }
            analysisHtml += `<div class="decade-note">💡 大運說明：依五行局起運，陽男陰女順行，陰男陽女逆行，每十年一宮。本命盤列至90歲大運。</div>`;
            document.getElementById('analysisContent').innerHTML = analysisHtml;
        }
        
        // 依月份/年份調整可選日數
        function refreshDays() {
            let y = parseInt(document.getElementById('year').value) || 1979;
            let m = parseInt(document.getElementById('month').value) || 1;
            let maxDay = new Date(y, m, 0).getDate();
            let dSel = document.getElementById('day');
            Array.from(dSel.options).forEach(opt => {
                opt.disabled = parseInt(opt.value) > maxDay;
            });
            if (parseInt(dSel.value) > maxDay) dSel.value = maxDay;
        }

        document.getElementById('year').addEventListener('change', refreshDays);
        document.getElementById('year').addEventListener('input', refreshDays);
        document.getElementById('month').addEventListener('change', refreshDays);
        document.getElementById('calcBtn').addEventListener('click', renderAll);
        window.addEventListener('DOMContentLoaded', () => { refreshDays(); renderAll(); });
    })();
</script>
